// ============================================================================
// IdentityGate — dreamy 身份域内部 gRPC 契约（Java backend ⇄ Rust server）
//
// 契约纪律:
//   1. 字段编号一经发布不可复用;废弃字段进 reserved,新增字段只用新编号。
//   2. 所有 rpc 的错误语义以 gRPC status 表达,Java 侧统一映射:
//      - NOT_FOUND        → 调用方按业务语义处理(GetUser 未命中)
//      - INVALID_ARGUMENT → 调用方编码 BUG(白名单外字段/条件/超限),FAIL FAST
//      - UNAVAILABLE / DEADLINE_EXCEEDED → HTTP 503 {code:50001},绝不映射 401(避免误踢登录态)
//      - 其余 status      → HTTP 500 {code:50000} + ERROR 日志
//   3. 调用方(Java)只传验签后的结构化标识(token_id=jti / admin_id / user_id),
//      绝不传原始 JWT 原文、绝不传密码/哈希。
//   4. 消息上限:fields ≤ 16、conditions ≤ 8、IN values ≤ 100、page_size ≤ 100,
//      超限一律 INVALID_ARGUMENT(白名单枚举 + 上限即注入面防线,无自由字符串拼 SQL)。
//
// 命名空间:后续域按 dreamy.<domain>.v1 增量加包,不扩本包。
// ============================================================================
syntax = "proto3";

package dreamy.identity.v1;

// ----------------------------------------------------------------------------
// 服务定义
// ----------------------------------------------------------------------------
service IdentityGate {
  // store 会话有效性(热路径,Java StoreJwtFilter 每请求调用)。
  // 纯读:任何内部错误以 UNAVAILABLE 表达(Java 转 503),绝不把基础设施故障伪装成 invalid。
  rpc ValidateStoreSession(ValidateStoreSessionRequest) returns (ValidateStoreSessionResponse);

  // admin 会话有效性(含管理员状态复核,对齐 Java SessionValidator.isAdminSessionValid)。
  rpc ValidateAdminSession(ValidateAdminSessionRequest) returns (ValidateAdminSessionResponse);

  // 管理员实时权限集(Java PermissionAspect 每次受注解保护的请求调用)。
  // admin 不存在 → 返回空列表(对齐 Java resolvePermissions 语义),不用 NOT_FOUND。
  rpc ResolvePermissions(ResolvePermissionsRequest) returns (ResolvePermissionsResponse);

  // 通用查询:GraphQL 式字段投影(只回填请求字段)+ 精确查找(单值)。
  // 未命中 → NOT_FOUND;白名单外字段 → INVALID_ARGUMENT。
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // 通用查询:MyBatis-Lambda 式类型化条件(枚举列 + 枚举操作符)+ 投影 + 分页。
  // 服务端强制追加 id 升序稳定兜底;LIKE 仅前缀匹配(防全表扫描)。
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);

  // demo 种子通道(Java ShowroomSeedInitializer/ReviewSeedInitializer 建 demo 用户用)。
  // 幂等:按 email 归并,已存在直接返回既有 user_id。
  rpc EnsureDemoUser(EnsureDemoUserRequest) returns (EnsureDemoUserResponse);

  // 预留:后续内部治理 rpc(缓存失效通告、种子版本协商等)从 100 号起编号。
}

// ----------------------------------------------------------------------------
// 会话校验
// ----------------------------------------------------------------------------
message ValidateStoreSessionRequest {
  // JWT jti(Java 本地验签后取出;空白 → INVALID_ARGUMENT)
  string token_id = 1;
  reserved 2 to 99;
}
message ValidateStoreSessionResponse {
  // user_session.status=ACTIVE 且未过期
  bool valid = 1;
  reserved 2 to 99;
}

message ValidateAdminSessionRequest {
  string token_id = 1; // JWT jti
  reserved 2 to 99;
}
message ValidateAdminSessionResponse {
  // admin_session.status=ACTIVE 且未过期
  bool valid = 1;
  // admin_user.status=ACTIVE(独立复核,valid=true 而 admin_active=false → Java 侧 40302 语义)
  bool admin_active = 2;
  reserved 3 to 99;
}

// ----------------------------------------------------------------------------
// 权限解析
// ----------------------------------------------------------------------------
message ResolvePermissionsRequest {
  int64 admin_id = 1;
  reserved 2 to 99;
}
message ResolvePermissionsResponse {
  // 超管角色(is_locked)短路返回全量权限码;否则 role_permission → permission.perm_code
  repeated string permission_keys = 1;
  reserved 2 to 99;
}

// ----------------------------------------------------------------------------
// 用户字段投影(白名单即防线:枚举之外无字段可选)
// ----------------------------------------------------------------------------
enum UserField {
  USER_FIELD_UNSPECIFIED = 0;
  USER_FIELD_ID = 1;
  USER_FIELD_EMAIL = 2;
  USER_FIELD_EMAIL_VERIFIED = 3;
  USER_FIELD_NAME = 4;
  USER_FIELD_PHONE = 5;
  USER_FIELD_TIER = 6;           // UserTier: 1=REGULAR 2=VIP
  USER_FIELD_STATUS = 7;         // UserStatus: 1=ACTIVE 2=DISABLED 3=DELETED 4=ANONYMIZED
  USER_FIELD_AVATAR = 8;
  USER_FIELD_LOCALE_PREF = 9;
  USER_FIELD_JOINED_AT = 10;     // ISO-8601(与 REST 序列化同构)
  USER_FIELD_ANONYMIZED = 11;
}

// ----------------------------------------------------------------------------
// GetUser
// ----------------------------------------------------------------------------
message GetUserRequest {
  oneof lookup {
    int64 id = 1;
    string email = 2;                        // 已规范化(小写)或由服务端规范化
    ProviderIdentity provider_identity = 3; // (provider, provider_uid) 复合查找
  }
  // 投影字段(去重后 ≤16);空 → 仅回填 id(最小默认)
  repeated UserField fields = 4;
  reserved 5 to 99;
}
message ProviderIdentity {
  int32 provider = 1;    // AuthProvider tinyint: 1=EMAIL 2=GOOGLE 3=APPLE
  string provider_uid = 2;
  reserved 3 to 15;
}
message GetUserResponse {
  // 全部 optional:仅回填请求投影的字段,未请求字段保持缺省
  optional int64 id = 1;
  optional string email = 2;
  optional bool email_verified = 3;
  optional string name = 4;
  optional string phone = 5;
  optional int32 tier = 6;
  optional int32 status = 7;
  optional string avatar = 8;
  optional string locale_pref = 9;
  optional string joined_at = 10;
  optional bool anonymized = 11;
  reserved 12 to 99;
}

// ----------------------------------------------------------------------------
// ListUsers(类型化条件构造:枚举列 × 枚举操作符,多条件 AND)
// ----------------------------------------------------------------------------
enum UserColumn {
  USER_COLUMN_UNSPECIFIED = 0;
  USER_COLUMN_ID = 1;
  USER_COLUMN_EMAIL = 2;
  USER_COLUMN_STATUS = 3;
  USER_COLUMN_TIER = 4;
  USER_COLUMN_CREATED_AT = 5;
  USER_COLUMN_JOINED_AT = 6;
}
enum CondOp {
  COND_OP_UNSPECIFIED = 0;
  COND_OP_EQ = 1;          // values 恰 1 个
  COND_OP_IN = 2;          // values 1..100
  COND_OP_LIKE_PREFIX = 3; // values 恰 1 个,前缀匹配(email 模糊检索专用)
}
message Condition {
  UserColumn column = 1;
  CondOp op = 2;
  repeated string values = 3; // 统一字符串传输,服务端按列类型强转(转不动 → INVALID_ARGUMENT)
  reserved 4 to 15;
}
message ListUsersRequest {
  repeated Condition conditions = 1; // ≤8,AND 语义
  repeated UserField fields = 2;     // ≤16
  // 排序白名单:"id|email|status|tier|created_at|joined_at" + 可选 " asc|desc";
  // 空 → 默认 "created_at desc";服务端恒定追加 id 升序稳定兜底。
  string order_by = 3;
  int32 page = 4;      // 1 起(0 视为 1)
  int32 page_size = 5; // 1..100(缺省 20)
  reserved 6 to 99;
}
message ListUsersResponse {
  repeated GetUserResponse items = 1;
  int64 total = 2; // 命中总数(与分页无关)
  reserved 3 to 99;
}

// ----------------------------------------------------------------------------
// Demo 种子
// ----------------------------------------------------------------------------
message EnsureDemoUserRequest {
  string email = 1; // 幂等键(规范化小写)
  string name = 2;
  reserved 3 to 15;
}
message EnsureDemoUserResponse {
  int64 user_id = 1;
  reserved 2 to 15;
}
