# ============================================================
# dreamy-server workspace —— dreamy 服务端本体(Rust 核心工程)
#
# 分包约定(模块化单体,按域分 crate):
#   crates/server    bin crate:组装与启动(main/router/openapi 装配),不含业务逻辑
#   crates/common    共享地基:R 包络/错误码全表/分区保障/config/DB 自举/健康端点/CORS 中间件
#   crates/proto     gRPC 契约生成(源头:仓库顶层 proto/;Java protobuf-maven-plugin 同源消费)
#   crates/identity  身份域(用户/认证/admin RBAC):api/service/entity/grpc/mail/oidc/ratelimit
#   crates/infra     横切基础设施:mq(事件总线)/sched(cron+fixedDelay)/cache(两级)/lock(分布式)
#
# 新域入驻约定(终局全量替换 Java):新建 crates/<domain>,自带 api/service/entity,
# 在 server crate 的 router.rs 挂载 + proto/ 增量加 dreamy.<domain>.v1 包。
# 依赖版本一律集中于 [workspace.dependencies],成员 crate 只做 workspace = true 引用。
# ============================================================
[workspace]
resolver = "2"
members = ["crates/server", "crates/common", "crates/proto", "crates/identity", "crates/infra"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# web / gRPC
axum = "0.8"
tonic = "0.13"
prost = "0.13"
tower-http = { version = "0.6", features = ["cors", "set-header", "request-id"] }
# 数据
sea-orm = { version = "1", features = ["sqlx-mysql", "runtime-tokio-rustls", "macros", "with-chrono"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 基础
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
jsonwebtoken = "9"
bcrypt = "0.15"
# CSPRNG(会话 jti/OTP 验证码;2026-09-15 替换可预测 LCG)
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"
thiserror = "2"
urlencoding = "2"
futures = "0.3"
# 错误位置注册表(error_site! 收集,测试断言唯一)
inventory = "0.3"
# 构建期
tonic-build = "0.13"
prost-build = "0.13"
# vendored protoc:锁定代码生成器版本,免系统 protoc 依赖
protoc-bin-vendored = "3"
# 内部 crate
common = { path = "crates/common" }
proto = { path = "crates/proto" }
identity = { path = "crates/identity" }
infra = { path = "crates/infra" }

[profile.release]
lto = "thin"
strip = "symbols"
