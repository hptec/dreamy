openapi: 3.1.0
info:
  title: dreamy server API
  description: dreamy 服务端本体(Rust 核心工程)。已入驻域:identity(用户/认证)。对外契约与 Java 原实现字节级对齐:R 包络、错误码、snake_case、ISO-8601 时间。
  license:
    name: ''
  version: 0.1.0
paths:
  /healthz:
    get:
      tags:
      - infra
      summary: liveness:进程存活即 200(不查依赖,避免依赖抖动引发容器重启风暴)
      operationId: healthz
      responses:
        '200':
          description: 进程存活
  /readyz:
    get:
      tags:
      - infra
      summary: readiness:DB 主/次连接 + Redis 连通性(compose healthcheck 与 deploy 探活挂钩)
      operationId: readyz
      responses:
        '200':
          description: 全部依赖就绪
        '503':
          description: 存在不可用依赖(checks 中明细)
components:
  schemas:
    REnvelope:
      type: object
      description: |-
        huihao R 包络的 OpenAPI 投影(与 crate::error::R 运行时结构一一对应;
        字段仅作 schema 声明,P2 起由业务端点引用)
      required:
      - code
      properties:
        code:
          type: integer
          format: int32
          description: 0=成功;其余为业务错误码(见各端点错误响应)
        data:
          description: 成功载荷;错误时为错误明细(如校验字段映射,注意:Map key 保持 Java 字段名不转 snake_case)
        message:
          type:
          - string
          - 'null'
        service_id:
          type:
          - string
          - 'null'
