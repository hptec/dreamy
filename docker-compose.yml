# ============================================================
# Dreamy 全家桶编排(本地验证与香港服务器共用)
#
# 变量来源:docker compose --env-file .env.deploy(模板见 .env.deploy.example)
# 本文件只有 ${VAR:-默认值} 引用与容器编排,无任何硬编码地址/密钥。
#
# 服务器日常部署:bash scripts/deploy.sh
# 本地验证:    docker compose --env-file .env.deploy up -d
# ============================================================
name: dreamy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.deploy 配置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: identity
      TZ: ${TZ:-Asia/Hong_Kong}
    volumes:
      - mysql-data:/var/lib/mysql
    # 仅绑本机回环:外部管理走 SSH 隧道,不对公网暴露
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # 本地原生服务(monitor/开发)需经宿主回环访问 Redis,对齐 mysql 的 127.0.0.1 映射前例
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ── 边缘网关:唯一对外入口(单端口路径分流,TLS 终结)──
  # / → store、/admin/ → admin、/api/ 与 /actuator/ → backend;
  # admin/backend 不映射宿主端口;证书放 ./nginx/certs/(生产=阿里云,本地=gen-dev-cert.sh 自签)
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      # admin API 加密前缀 secret 段(必填,openssl rand -hex 12 生成)
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:?请在 .env.deploy 配置 ADMIN_API_SECRET(openssl rand -hex 12 生成)}
      STORE_UPSTREAM: ${STORE_UPSTREAM:-http://portal-store:3000}
      ADMIN_UPSTREAM: ${ADMIN_UPSTREAM:-http://portal-admin:80}
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:18081}
      SERVER_UPSTREAM: ${SERVER_UPSTREAM:-http://server:18082}
    volumes:
      - ./nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${STORE_PORT:-5173}:5173"
    healthcheck:
      # 证书 CN 是公网域名,容器内探活打 127.0.0.1 必须免校验
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      - backend
      - server
      - portal-store
      - portal-admin

  backend:
    # 本地镜像:由 scripts/remote-build.sh 在本机构建(不走镜像仓库),tag 历史留在本机 docker daemon
    image: dreamy-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 整份 .env.deploy(secrets/模式开关等)注入后端容器
    env_file: .env.deploy
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      # 服务间地址:默认 compose 内网互通;外置 MySQL/Redis 时在 .env.deploy 覆盖
      DB_URL: "${DB_URL:-jdbc:mysql://mysql:3306/identity?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}"
      DB_USERNAME: ${DB_USERNAME:-root}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      LOGGING_FILE_NAME: /app/logs/identity.log
      # Rust server(身份域)gRPC 通道(P4 切换版接线后启用)
      IDENTITY_GRPC_ADDR: ${IDENTITY_GRPC_ADDR:-http://server:18083}
      # 派生地址:默认取公网入口变量,避免同一 URL 重复填写(如需偏离再显式覆盖)
      SITE_BASE_URL: ${SITE_BASE_URL:-${PUBLIC_STORE_URL:-http://localhost:5173}}
      STORE_CORS_ORIGIN: ${STORE_CORS_ORIGIN:-${PUBLIC_STORE_URL:-http://localhost:5173}}
      # 单端口同源部署:admin 与 store 共用网关入口,Origin 一致(PUBLIC_ADMIN_URL 含 /admin 路径不可作 Origin)
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-${PUBLIC_STORE_URL:-http://localhost:5173}}
    volumes:
      - ./data/logs/backend:/app/logs
    # 仅绑本机回环:deploy.sh 健康检查/调试用,不对公网暴露(webhook 走网关 /api)
    ports:
      - "127.0.0.1:${BACKEND_PORT:-18081}:18081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Rust server(dreamy-server):身份域(用户/认证/admin RBAC)首个入驻域;
  #     主库 dreamy_server(operation_log/email_template 已收编;Java 业务侧经
  #     gRPC 18083 AuditGate/TemplateGate 写读);
  #     REST 18082(经网关分流) + gRPC 18083(backend 内部通道)──
  server:
    image: dreamy-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # 整份 .env.deploy 注入(DB_PASSWORD/JWT 双密钥/RESEND_API_KEY 等复用)
    env_file: .env.deploy
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      SERVER_HTTP_PORT: 18082
      SERVER_GRPC_PORT: 18083
      SERVER_DB_HOST: mysql
      SERVER_DB_PORT: 3306
      SERVER_DB_NAME: dreamy_server
      DB_USERNAME: ${DB_USERNAME:-root}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      STORE_CORS_ORIGIN: ${STORE_CORS_ORIGIN:-${PUBLIC_STORE_URL:-http://localhost:5173}}
      ADMIN_CORS_ORIGIN: ${ADMIN_CORS_ORIGIN:-${PUBLIC_STORE_URL:-http://localhost:5173}}
      # 日志双写:容器内 /app/logs(与 backend 同口径),按天滚动 dreamy-server.<date>.log
      SERVER_LOG_DIR: /app/logs
    volumes:
      - ./data/logs/server:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 仅绑本机回环:调试与 deploy.sh 探活用(gRPC 18083 仅 compose 内网开放,不对宿主暴露)
    ports:
      - "127.0.0.1:${SERVER_PORT:-18082}:18082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18082/readyz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  portal-store:
    image: dreamy-store:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      # standalone server.js 绑定 0.0.0.0(默认 localhost 在容器内不可达)
      HOSTNAME: 0.0.0.0
      PORT: 3000
      # 同源 API 反代(middleware)与 RSC 服务端取数共用后端内网地址
      BACKEND_ORIGIN: ${BACKEND_INTERNAL_URL:-http://backend:18081}
      API_ORIGIN: ${BACKEND_INTERNAL_URL:-http://backend:18081}
      # middleware 身份域分流(与网关 gateway.conf.template 口径一致):auth/account → Rust server
      SERVER_ORIGIN: ${SERVER_INTERNAL_URL:-http://server:18082}
      # CSP frame-ancestors 的管理端来源(headers() 在 build 时固化):同源部署与 store 入口一致
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-${PUBLIC_STORE_URL:-http://localhost:5173}}
    depends_on:
      - backend

  portal-admin:
    image: dreamy-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      # nginx envsubst 模板渲染 /api 反代地址
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:18081}
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
